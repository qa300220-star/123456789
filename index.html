    <style>
        :root {
            --primary: #6c5ce7;
            --accent: #fd79a8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--gradient);
            padding: 15px;
            text-align: center;
            color: white;
            flex-shrink: 0;
        }

        .header .logo {
            font-size: 40px;
            margin-bottom: 3px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .footer-credit {
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: 800;
            color: #6c5ce7;
            background: linear-gradient(135deg, #f0edff 0%, #e8e0ff 100%);
            flex-shrink: 0;
            letter-spacing: 1px;
            border-top: 3px solid #6c5ce7;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        .login-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 20px;
        }

        .login-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 5px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .form-group input {
            padding: 10px 14px;
            height: 44px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: var(--gradient);
            color: white;
            margin-top: 10px;
        }

        .btn:active { transform: scale(0.95); }

        .logout-btn {
            background: #ffe0e0;
            color: #c62828;
            border: 2px solid #ef9a9a;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .welcome-msg {
            background: #e8f5e9;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #2e7d32;
            font-weight: bold;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .back-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            margin-bottom: 8px;
            align-self: flex-start;
            font-weight: bold;
        }

        .days-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
        }

        .day-btn {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .day-btn:active { transform: scale(0.97); }

        .day-btn .day-icon {
            font-size: 20px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .day-btn .day-name {
            flex: 1;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .day-btn.today {
            border-color: var(--accent);
            background: #fff5f5;
        }

        .day-btn.today .day-icon { background: var(--accent); }
        .day-btn.today .day-name { color: var(--accent); }

        .periods-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            justify-content: center;
        }

        .period-box {
            padding: 11px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .period-box:active { transform: scale(0.97); }

        .period-box .period-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            background: var(--primary);
            color: white;
            flex-shrink: 0;
        }

        .period-box .period-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content .big-icon { font-size: 50px; margin-bottom: 10px; }
        .modal-content .teacher-name { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .modal-content .subject-name { font-size: 26px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .modal-content .grade-name { font-size: 18px; color: var(--accent); font-weight: bold; margin-bottom: 15px; }
        .modal-content .close-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌅</div>
            <h1>غورب</h1>
            <p>جدول المعلمات</p>
        </div>

        <div class="content">
            <div class="screen active" id="loginScreen">
                <div class="login-form">
                    <div class="login-icon">👩‍🏫</div>
                    <div class="login-title">مرحباً بكِ</div>
                    <div class="login-subtitle">سجلي دخولك للوصول لجدولك</div>
                    <div class="form-group">
                        <label>👤 الاسم:</label>
                        <input type="text" id="teacherName" placeholder="اكتبي اسمك" inputmode="text" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>🔒 كلمة السر:</label>
                        <input type="password" id="teacherPassword" placeholder="كلمة السر" inputmode="numeric" autocomplete="off">
                    </div>
                    <button class="btn" onclick="login()">دخول</button>
                </div>
            </div>

            <div class="screen" id="daysScreen">
                <div class="welcome-msg" id="welcomeMsg"></div>
                <h2 style="text-align: center; color: #333; font-size: 17px; flex-shrink: 0; margin-bottom: 8px;">اختر اليوم</h2>
                <div class="days-grid">
                    <button class="day-btn" id="btn-sunday" onclick="selectDay('sunday')"><span class="day-icon">📅</span><span class="day-name">الأحد</span></button>
                    <button class="day-btn" id="btn-monday" onclick="selectDay('monday')"><span class="day-icon">📅</span><span class="day-name">الإثنين</span></button>
                    <button class="day-btn" id="btn-tuesday" onclick="selectDay('tuesday')"><span class="day-icon">📅</span><span class="day-name">الثلاثاء</span></button>
                    <button class="day-btn" id="btn-wednesday" onclick="selectDay('wednesday')"><span class="day-icon">📅</span><span class="day-name">الأربعاء</span></button>
                    <button class="day-btn" id="btn-thursday" onclick="selectDay('thursday')"><span class="day-icon">📅</span><span class="day-name">الخميس</span></button>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 تسجيل خروج</button>
            </div>

            <div class="screen" id="periodsScreen">
                <button class="back-btn" onclick="goBackToDays()">→ رجوع</button>
                <h2 style="text-align: center; color: #333; font-size: 17px; flex-shrink: 0; margin-bottom: 8px;" id="dayTitle"></h2>
                <div class="periods-grid" id="periodsGrid"></div>
            </div>
        </div>

        <div class="footer-credit">
            تطوير: سالم محمد
        </div>
    </div>

    <div class="modal" id="lessonModal">
        <div class="modal-content">
            <div class="big-icon" id="modalIcon">📚</div>
            <div class="teacher-name" id="modalTeacher"></div>
            <div class="subject-name" id="modalSubject"></div>
            <div class="grade-name" id="modalGrade"></div>
            <button class="close-btn" onclick="closeModal()">حسناً ✓</button>
        </div>
    </div>

                3: [{p:1, s:"اسلاميه", t:"منار"}, {p:2, s:"عربي", t:"جميلة"}, {p:3, s:"رياضيات", t:"صفاء"}, {p:4, s:"عربي", t:"جميلة"}],
                4: [{p:1, s:"عربي", t:"مها"}, {p:2, s:"رياضيات", t:"نعيمه"}, {p:3, s:"رياضيات", t:"نعيمه"}, {p:4, s:"عربي", t:"مها"}, {p:5, s:"اسلاميه", t:"منار"}],
                5: [{p:1, s:"رياضيات", t:"نعيمه"}, {p:2, s:"عربي", t:"فاطمه"}, {p:3, s:"قرآن", t:"صفاء"}, {p:4, s:"اجتماعيات", t:"منار"}, {p:5, s:"عربي", t:"فاطمه"}],
                6: [{p:1, s:"عربي", t:"عبير"}, {p:2, s:"اجتماعيات", t:"امنة"}, {p:3, s:"اسلاميه", t:"عبير"}, {p:4, s:"رياضيات", t:"نعيمه"}, {p:5, s:"عربي", t:"عبير"}],
                7: [{p:1, s:"عربي", t:"سعيدان"}, {p:2, s:"E", t:"اليمامه"}, {p:3, s:"رياضيات", t:"هديل"}, {p:4, s:"علوم", t:"هناء"}, {p:5, s:"اجتماعيات", t:"منار"}],
                8: [{p:1, s:"E", t:"اليمامه"}, {p:2, s:"رياضيات", t:"هديل"}, {p:3, s:"اجتماعيات", t:"امنة"}, {p:4, s:"عربي", t:"فاطمه"}, {p:5, s:"قرآن", t:"سعيدان"}],
                9: [{p:1, s:"رياضيات", t:"هديل"}, {p:2, s:"عربي", t:"عبير"}, {p:3, s:"E", t:"اليمامه"}, {p:4, s:"اجتماعيات", t:"امنة"}, {p:5, s:"علوم", t:"هناء"}]
            }
        };

        const passwords = {
            "صفاء": "11", "جميله": "22", "منار": "33", "مها": "44",
            "نعيمه": "55", "فاطمه": "66", "هناء": "77", "عبير": "88",
            "هديل": "99", "سعيدان": "10", "اليمامة": "12", "امنة": "13"
        };

        let currentTeacher = null;
        let currentDay = null;

        function highlightToday() {
            const now = new Date();
            const dayMap = { 0:'sunday', 1:'monday', 2:'tuesday', 3:'wednesday', 4:'thursday', 5:'sunday', 6:'sunday' };
            const todayKey = dayMap[now.getDay()];
            const btn = document.getElementById('btn-' + todayKey);
            if (btn) btn.classList.add('today');
        }

        function login() {
            const name = document.getElementById('teacherName').value.trim();
            const password = document.getElementById('teacherPassword').value;
            if (passwords[name] && passwords[name] === password) {
                currentTeacher = name;
                localStorage.setItem('loggedInTeacher', name);
                document.getElementById('welcomeMsg').innerHTML = `👩‍🏫 مرحباً أ. ${name}`;
                showScreen('daysScreen');
            } else {
                alert('الاسم أو كلمة السر خطأ');
            }
        }

        function logout() {
            localStorage.removeItem('loggedInTeacher');
            currentTeacher = null;
            document.getElementById('teacherName').value = '';
            document.getElementById('teacherPassword').value = '';
            showScreen('loginScreen');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectDay(day) {
            currentDay = day;
            const dayNames = { 'sunday':'الأحد', 'monday':'الإثنين', 'tuesday':'الثلاثاء', 'wednesday':'الأربعاء', 'thursday':'الخميس' };
            document.getElementById('dayTitle').textContent = `📅 يوم ${dayNames[day]}`;
            showScreen('periodsScreen');
            displayPeriods();
        }

        function goBackToDays() { showScreen('daysScreen'); }

        function displayPeriods() {
            const grid = document.getElementById('periodsGrid');
            let html = '';
            for (let i = 1; i <= 7; i++) {
                html += `<div class="period-box" onclick="showLessonInfo(${i})">
                    <span class="period-number">${i}</span>
                    <span class="period-label">الحصة ${i}</span>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function showLessonInfo(periodNumber) {
            const lessons = findTeacherLessons(currentTeacher, currentDay);
            const lesson = lessons.find(l => l.p === periodNumber);
            
            if (lesson) {
                document.getElementById('modalIcon').textContent = '📚';
                document.getElementById('modalTeacher').textContent = `👩‍🏫 أ. ${currentTeacher}`;
                document.getElementById('modalSubject').textContent = lesson.s;
                document.getElementById('modalGrade').textContent = `📍 الصف ${lesson.grade}`;
            } else {
                document.getElementById('modalIcon').textContent = '☕';
                document.getElementById('modalTeacher').textContent = `👩‍🏫 أ. ${currentTeacher}`;
                document.getElementById('modalSubject').textContent = 'استراحة';
                document.getElementById('modalGrade').textContent = 'لا توجد حصة عندك';
            }
            
            document.getElementById('lessonModal').classList.add('show');
        }

        function findTeacherLessons(teacherName, day) {
            const lessons = [];
            const dayData = fullSchedule[day];
            for (let grade in dayData) {
                dayData[grade].forEach(lesson => {
                    if (lesson.t === teacherName) {
                        lessons.push({...lesson, grade: grade});
                    }
                });
            }
            return lessons;
        }

        function closeModal() { document.getElementById('lessonModal').classList.remove('show'); }

        window.onload = function() {
            highlightToday();
            const saved = localStorage.getItem('loggedInTeacher');
            if (saved && passwords[saved]) {
                currentTeacher = saved;
                document.getElementById('welcomeMsg').innerHTML = `👩‍🏫 مرحباً أ. ${saved}`;
                showScreen('daysScreen');
            } else {
                showScreen('loginScreen');
            }
        };
    </script>
</body>
</html>
