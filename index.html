<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غورب - صيانة</title>
    
    <!-- خط القاهرة الرسمي لجمالية الخطوط -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* حاوية بتأثير زجاجي فخم يناسب الخلفية الملونة */
        .maintenance-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease-out;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p {
            font-size: 17px;
            color: #e2e8f0;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* تصميم العداد التنازلي الجديد */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: ltr;
        }

        .time-segment {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px;
            min-width: 70px;
        }

        .time-val {
            font-size: 24px;
            font-weight: 700;
            color: #a78bfa;
            display: block;
        }

        .time-lbl {
            font-size: 12px;
            color: #cbd5e1;
            font-family: 'Cairo', sans-serif;
        }

        /* نقاط التحميل المتحركة أسفل الصفحة */
        .loading {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a78bfa;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <div class="icon">🔧</div>
        <h1>غورب</h1>
        <p>الموقع تحت الصيانة حالياً<br>سنعود قريباً إن شاء الله</p>
        
        <!-- العداد التنازلي المضاف -->
        <div class="countdown">
            <div class="time-segment"><span class="time-val" id="sec">00</span><span class="time-lbl">ثانية</span></div>
            <div class="time-segment"><span class="time-val" id="min">00</span><span class="time-lbl">دقيقة</span></div>
            <div class="time-segment"><span class="time-val" id="hr">00</span><span class="time-lbl">ساعة</span></div>
            <div class="time-segment"><span class="time-val" id="day">00</span><span class="time-lbl">يوم</span></div>
        </div>

        <div class="loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // موعد الإطلاق: غداً الثلاثاء 8 سبتمبر الساعة 8:40 صباحاً (08:40)
        // كتابة التاريخ برمجياً: (السنة، الشهر - 1، اليوم، الساعة، الدقيقة، الثانية)
        const targetDate = new Date(2026, 8, 8, 8, 40, 0).getTime(); 

        // رابط التحويل التلقائي لملف موقعك الأصلي بعد الصيانة
        const mainPageUrl = "main.html"; 

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(timer);
                // تحويل تلقائي فوري إلى صفحة موقعك الأصلي
                window.location.href = mainPageUrl;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("day").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hr").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("min").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("sec").innerText = seconds < 10 ? "0" + seconds : seconds;

        }, 1000);
    </script>
</body>
</html>
