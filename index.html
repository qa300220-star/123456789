<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غورب - صيانة</title>
    <style>
        /* استخدام خطوط النظام السريعة المدمجة بجهاز المستخدم مباشرة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .maintenance-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 30px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            color: #e2e8f0;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            direction: ltr;
        }

        .time-segment {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            min-width: 65px;
        }

        .time-val {
            font-size: 22px;
            font-weight: 700;
            color: #a78bfa;
            display: block;
        }

        .time-lbl {
            font-size: 11px;
            color: #cbd5e1;
        }

        .loading {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #a78bfa;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <div class="icon">🔧</div>
        <h1>غورب</h1>
        <p>الموقع تحت الصيانة حالياً<br>سنعود قريباً إن شاء الله</p>
        
        <div class="countdown">
            <div class="time-segment"><span class="time-val" id="sec">00</span><span class="time-lbl">ثانية</span></div>
            <div class="time-segment"><span class="time-val" id="min">00</span><span class="time-lbl">دقيقة</span></div>
            <div class="time-segment"><span class="time-val" id="hr">00</span><span class="time-lbl">ساعة</span></div>
            <div class="time-segment"><span class="time-val" id="day">00</span><span class="time-lbl">يوم</span></div>
        </div>

        <div class="loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // موعد الإطلاق: غداً الثلاثاء 8 سبتمبر 2026 الساعة 8:40 صباحاً
        const targetDate = new Date(2026, 8, 8, 8, 40, 0).getTime(); 
        const mainPageUrl = "main.html"; 

        // دالة لحساب وتحديث الوقت فوراً عند فتح الصفحة بدون تأخير ثانية واحدة
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(timer);
                window.location.href = mainPageUrl;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("day").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hr").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("min").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("sec").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        // تشغيل فوري
        updateCountdown();
        // تحديث كل ثانية
        const timer = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
